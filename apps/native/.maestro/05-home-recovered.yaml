# Ticket 05 Home after recovery, for ios-preview step 4. It runs on the load-failed card that 05-home-error.yaml left
# open, after the API server answers again, and taps "ลองอีกครั้ง" (retry) one time.
appId: com.anonymous.moojot
---
- tapOn: "ลองอีกครั้ง"
- extendedWaitUntil:
    notVisible: "โหลดรายการไม่สำเร็จ"
    timeout: 30000
# The total's spoken name is "ยอดใช้จ่าย <amount> บาท" (spending), or "ยอดใช้จ่าย · <from> – <to> <amount> บาท" when the
# month does not start on the 1st. Until the data is shown, it ends in "ยังไม่ทราบ" (not known yet) instead.
- extendedWaitUntil:
    visible: "ยอดใช้จ่าย.* [0-9][0-9,]*\\.[0-9]{2} บาท"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 05-app-home-recovered
