# Ticket 02 signup / sign-in states, named <NN>-app-<state>. It signs up accounts in the development database, so run it with
#   node scripts/ios-preview.mjs apps/native/.maestro/02-auth-flow.yaml <out-dir> --fixture --first-start
# --fixture makes an account with setup complete (MAESTRO_FIXTURE_*) and an address with no account (MAESTRO_NEW_EMAIL);
# --first-start signs the app out and forgets the remembered email, so it opens signup.
appId: com.anonymous.moojot
---
- extendedWaitUntil:
    visible:
      id: "auth-email"
    timeout: 15000
- takeScreenshot: 02-app-signup
# Incomplete submit: one error beside each field.
- tapOn:
    id: "auth-submit"
- waitForAnimationToEnd
- takeScreenshot: 02-app-signup-errors
# Typing clears only that field's error; Enter moves to the next field.
- tapOn:
    id: "auth-name"
- inputText: ${MAESTRO_FIXTURE_NAME}
- pressKey: Enter
- inputText: ${MAESTRO_FIXTURE_EMAIL}
- pressKey: Enter
# Show the password first: in a hidden new-password field the simulator's Automatic Strong Password cover takes the typing.
- tapOn: "แสดงรหัสผ่าน"
- tapOn:
    id: "auth-password"
- inputText: "wrong-p"
- takeScreenshot: 02-app-signup-typing
- inputText: "a"
- takeScreenshot: 02-app-password-shown
- tapOn: "ซ่อนรหัสผ่าน"
# The email already has an account.
- tapOn:
    id: "auth-submit"
- extendedWaitUntil:
    visible: "อีเมลนี้มีบัญชีอยู่แล้ว"
    timeout: 10000
- takeScreenshot: 02-app-signup-duplicate
# The on-screen keyboard can cover the notice action, and hideKeyboard fails here; a tap on the heading closes it.
- tapOn: "หมูจด"
- tapOn: "เข้าสู่ระบบด้วยอีเมลนี้"
- waitForAnimationToEnd
- takeScreenshot: 02-app-signin-from-notice
- tapOn:
    id: "auth-submit"
- extendedWaitUntil:
    visible: "รหัสผ่านไม่ถูกต้อง ลองอีกครั้ง"
    timeout: 10000
- takeScreenshot: 02-app-signin-wrong-password
- tapOn:
    id: "auth-password"
- eraseText: 20
- inputText: ${MAESTRO_FIXTURE_PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    visible: "ยินดีต้อนรับกลับ ${MAESTRO_FIXTURE_NAME}"
    timeout: 15000
- takeScreenshot: 02-app-home-welcome
# Sign out from the account sheet; the app reopens sign-in with this email and no password.
- tapOn: "พี่มนุษย์, tab.*"
- tapOn: "ข้อมูลในแอป.*"
- extendedWaitUntil:
    visible: "อีเมล.*"
    timeout: 15000
- tapOn: "อีเมล.*${MAESTRO_FIXTURE_EMAIL}.*"
- waitForAnimationToEnd
- takeScreenshot: 02-app-signout-sheet
- tapOn: "ออกจากระบบ"
- extendedWaitUntil:
    visible:
      id: "auth-email"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 02-app-signin-after-signout
# An email without an account: the notice offers signup with it, keeping the email.
- tapOn:
    id: "auth-email"
- eraseText: 80
- inputText: ${MAESTRO_NEW_EMAIL}
- tapOn:
    id: "auth-password"
- inputText: "new-password"
- pressKey: Enter
- extendedWaitUntil:
    visible: "ยังไม่มีบัญชีของอีเมลนี้"
    timeout: 10000
- takeScreenshot: 02-app-signin-unknown
# The on-screen keyboard can cover the notice action, and hideKeyboard fails here; a tap on the heading closes it.
- tapOn: "หมูจด"
- tapOn: "สมัครสมาชิกด้วยอีเมลนี้"
- tapOn:
    id: "auth-name"
- inputText: "หมูใหม่"
- takeScreenshot: 02-app-signup-from-notice
- tapOn:
    id: "auth-submit"
- extendedWaitUntil:
    visible: "สวัสดีพี่มนุษย์!"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 02-app-greeting
