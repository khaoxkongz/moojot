# Signs in with MAESTRO_PREVIEW_EMAIL / MAESTRO_PREVIEW_PASSWORD when the app shows the auth screen; does nothing when already signed in.
# Keys on the auth screen's test IDs (auth-mode-signin, auth-email, auth-password); update them here if the screen changes.
# The screen may open in signup mode (first start) or with the remembered email filled in (after sign-out), so it picks the
# sign-in tab and replaces the email.
appId: com.anonymous.moojot
---
# A new data container (a fresh install, or the reinstall in scripts/ios-preview.mjs) opens the dev menu's intro sheet.
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
      - tapOn: "Close"
- runFlow:
    when:
      visible: "เข้าสู่หมูจด"
    commands:
      - tapOn: "เข้าสู่หมูจด"
- runFlow:
    when:
      visible:
        id: "auth-email"
    commands:
      - tapOn:
          id: "auth-mode-signin"
      - tapOn:
          id: "auth-email"
      - eraseText: 80
      - inputText: ${MAESTRO_PREVIEW_EMAIL}
      - tapOn:
          id: "auth-password"
      - eraseText: 80
      - inputText: ${MAESTRO_PREVIEW_PASSWORD}
      # Return on the password submits; Maestro's hideKeyboard fails on this screen.
      - pressKey: Enter
- extendedWaitUntil:
    visible: "จดเพิ่ม"
    timeout: 30000
